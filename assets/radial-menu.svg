  <text x="230" y="204" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="700">HaloCap</text>
  <text x="230" y="228" text-anchor="middle" fill="#94a3b8" font-size="13">F6 呼出</text>
  <text x="455" y="92" fill="#f8fafc" font-size="34" font-weight="700">一个光圈，四种操作</text>
  <text x="455" y="128" fill="#94a3b8" font-size="17">光标移到需要的位置，按 F6 就地展开</text>
  <text x="455" y="154" fill="#94a3b8" font-size="17">单击扇区或按 1 / 2 / 3 / 4，也可直接用操作快捷键</text>
  <rect x="455" y="192" width="22" height="22" rx="6" fill="#38bdf8"/>
  <text x="489" y="210" fill="#e2e8f0" font-size="18" font-weight="600">截图</text>
  <text x="547" y="210" fill="#38bdf8" font-size="15" font-weight="700">F1</text>
  <text x="595" y="210" fill="#94a3b8" font-size="14">框选或识别窗口，标注后复制/保存/贴图</text>
  <rect x="455" y="242" width="22" height="22" rx="6" fill="#a78bfa"/>
  <text x="489" y="260" fill="#e2e8f0" font-size="18" font-weight="600">识别</text>
  <text x="547" y="260" fill="#a78bfa" font-size="15" font-weight="700">F7</text>
  <text x="595" y="260" fill="#94a3b8" font-size="14">框选文字，双引擎识别，三种视图</text>
  <rect x="455" y="292" width="22" height="22" rx="6" fill="#fb7185"/>
  <text x="489" y="310" fill="#e2e8f0" font-size="18" font-weight="600">录屏</text>
  <text x="547" y="310" fill="#fb7185" font-size="15" font-weight="700">F8</text>
  <text x="595" y="310" fill="#94a3b8" font-size="14">区域或窗口录制，输出 H.264 + AAC</text>
  <rect x="455" y="342" width="22" height="22" rx="6" fill="#34d399"/>
  <text x="489" y="360" fill="#e2e8f0" font-size="18" font-weight="600">贴图</text>
  <text x="547" y="360" fill="#34d399" font-size="15" font-weight="700">F3</text>
  <text x="595" y="360" fill="#94a3b8" font-size="14">把剪贴板内容固定到桌面</text>
  <text x="455" y="398" fill="#64748b" font-size="13">本机处理 · 无需联网 · 便携免安装</text>
